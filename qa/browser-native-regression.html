<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>原生计时器与本机房号回归</title><style>body{font:16px system-ui;background:#101719;color:#eaf0ee}iframe{width:640px;height:360px;border:1px solid #888}pre{white-space:pre-wrap}button{padding:10px}</style><h1>原生浏览器回归</h1><p>使用真实 Window 计时器和 IndexedDB；播放器本体是替身，不验证 YouTube 出声或循环。</p><button id="run">运行原生回归</button><pre id="report">尚未执行</pre><iframe id="game" title="窄视口启动" src="../index.html?qa=1"></iframe><div id="player"></div><script type="module">
import {OfficialAlbumPlayer} from '../src/official-music.js';import {MatchRecord} from '../src/match-api.js';import {LocalRoomRegistry} from '../src/local-rooms.js';import {NET_VERSION} from '../src/net-version.js';
const output=document.querySelector('#report'),rows=[],wait=ms=>new Promise(resolve=>window.setTimeout(resolve,ms));const check=(name,pass)=>{rows.push({name,pass});if(!pass)throw Error(name);};
document.querySelector('#run').onclick=async()=>{rows.length=0;let p,registry;try{const frame=document.querySelector('#game');check('窄视口真实游戏启动',frame.contentWindow.DUEL&&frame.contentDocument.querySelectorAll('[data-playmode]').length===2);p=new OfficialAlbumPlayer({root:document.querySelector('#player'),document,window,apiLoader:async()=>({Player:class{constructor(node,{events}){this.node=node;window.setTimeout(()=>events.onReady({target:this}),0);}setVolume(){}unMute(){}mute(){}getCurrentTime(){return 0;}getDuration(){return 10;}getIframe(){return this.node;}destroy(){this.node.remove();}}})});p.setAvailable(false);check('无空间启动clearInterval接收者正常',true);p.configure(true);p.setAvailable(true);await wait(300);p.configure(false);check('真实setInterval及清理接收者正常',!p.frame);let polled=false;const r=new MatchRecord({mode:'pvp',transport:'p2p',heroes:[0,1],match:{id:'test'},storage:null,service:{async getMatch(){polled=true;return {id:'test',status:'confirmed'};}}});r.status='pending';r.watch();await wait(2200);check('战绩轮询真实setTimeout接收者正常',polled&&r.status==='confirmed');const name='duel-qa-registry-'+crypto.randomUUID();registry=new LocalRoomRegistry({name});const a=await registry.reserve('host');check('真实IndexedDB六位预约',/^\d{6}$/.test(a.code));const attempts=await Promise.allSettled([registry.claim(a.code,'guest1'),registry.claim(a.code,'guest2')]);check('真实并发认领只有一位客端成功',attempts.filter(x=>x.status==='fulfilled').length===1);await registry.release(a.code,a.id,'host');(await registry.open()).close();indexedDB.deleteDatabase(name);output.textContent=JSON.stringify({status:'passed',version:NET_VERSION,rows,scope:'Native browser timers and IndexedDB; fake video API; no music loop claim'},null,2);}catch(e){output.textContent=JSON.stringify({status:'failed',version:NET_VERSION,rows,error:String(e),stack:e.stack},null,2);}finally{p?.configure(false);}};
</script></html>
