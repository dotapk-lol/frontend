<!doctype html><meta charset="utf-8"><title>DOTA DUEL 生产信令验收</title><style>body{font:16px system-ui;background:#101923;color:#eee;margin:24px}button{padding:12px}pre{white-space:pre-wrap}</style><h1>生产信令验收</h1><p>通过当前站点正常登录会话运行。仅创建短暂夹具房间并清理，不证明真实WebRTC或跨网络。</p><button id="run">运行信令与资源检查</button><pre id="result">尚未运行</pre><script type="module">
const out=document.querySelector('#result'),run=document.querySelector('#run');run.onclick=async()=>{run.disabled=true;const rows=[];let room=null;const host=crypto.randomUUID()+crypto.randomUUID(),guest=crypto.randomUUID()+crypto.randomUUID(),third=crypto.randomUUID()+crypto.randomUUID();const record=(name,pass,detail)=>{rows.push({name,pass,detail});out.textContent=JSON.stringify({result:rows.every(r=>r.pass)?'running':'failed',rows},null,2);if(!pass)throw Error(name);};const req=async(path,method='GET',body,token=host)=>{const r=await fetch('/api/p2p/'+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{}),cache:'no-store'});return {status:r.status,data:await r.json()};};try{for(const p of ['/','/src/music.js','/src/p2p.js','/src/net-version.js','/assets/atlas.json']){const r=await fetch(p,{cache:'no-store'});const body=await r.text();record('资源 '+p,r.ok&&body.length>20,{status:r.status,bytes:body.length});}let r=await req('health');record('生产DB信令health',r.status===200&&r.data.transport==='webrtc',r);r=await req('rooms/AAAAAAAAAA','GET',null,null);record('无会话凭据拒绝',r.status===401,r);const offer={type:'offer',sdp:'v=0\r\nproduction acceptance fixture'},answer={type:'answer',sdp:'v=0\r\nanswer fixture'};r=await req('rooms','POST',{offer,version:'qa-fixture',policy:{direction:'above',rttMs:100}});record('建房',r.status===201,r);room=r.data.code;const p='rooms/'+room;r=await req(p,'GET',null,guest);record('读取offer',r.status===200&&r.data.offer.sdp===offer.sdp,r);r=await req(p+'/answer','GET',null,third);record('非房主禁止读取answer',r.status===403,r);r=await req(p+'/answer','POST',{answer,version:'wrong'},guest);record('版本不匹配拒绝',r.status===409,r);r=await req(p+'/answer','POST',{answer,version:'qa-fixture'},guest);record('访客认领',r.status===200,r);r=await req(p+'/answer','POST',{answer,version:'qa-fixture'},guest);record('相同应答幂等',r.status===200,r);r=await req(p+'/answer','POST',{answer,version:'qa-fixture'},third);record('第三人拒绝',r.status===409,r);r=await req(p+'/answer','POST',{answer:{type:'answer',sdp:'v=0\r\nchanged'},version:'qa-fixture'},guest);record('禁止覆盖answer',r.status===409,r);r=await req(p+'/answer');record('房主读取answer',r.status===200&&r.data.answer.sdp===answer.sdp,r);r=await req(p,'DELETE',null,guest);record('非房主禁止删除',r.status===403,r);r=await req(p,'DELETE');record('房主清理',r.status===200,r);room=null;r=await req(p);record('清理后404',r.status===404,r);r=await req('rooms','POST',{offer:{},version:'bad',policy:{}});record('无效SDP拒绝',r.status===400,r);r=await req('rooms','POST',{padding:'x'.repeat(46000)});record('超大请求拒绝',r.status===413,r);out.textContent=JSON.stringify({result:'passed',scope:'production authenticated HTTP; fixture SDP, not cross-network',at:new Date().toISOString(),rows},null,2);}catch(e){out.textContent=JSON.stringify({result:'failed',error:e.message,rows},null,2);}finally{if(room)await req('rooms/'+room,'DELETE').catch(()=>{});run.disabled=false;}};
</script>
