<!doctype html><html lang="zh"><meta charset="utf-8"><title>P2P真实DataChannel验收</title><style>body{background:#0b1521;color:#ecf3f9;font:16px system-ui;margin:24px}button{padding:12px;margin:6px}pre{white-space:pre-wrap;background:#182a3a;padding:18px}iframe{width:48%;height:450px;border:1px solid #64788a}</style>
<h1>P2P真实浏览器验收</h1><p>使用当前站点信令API及真实RTCPeerConnection。两端在同一电脑内，不代表跨设备或跨网络。100ms仅为测试夹具，非产品默认规则。</p><button id="run">运行连接 / 禁战 / 断线检查</button><button id="stop">关闭测试连接</button><pre id="report">尚未执行</pre>
<script type="module">
import {PeerSession} from '../src/p2p.js';import {DEFAULT_NET_POLICY} from '../src/net-quality.js';
const out=document.querySelector('#report');let h,g,results=[],running=false;const pause=ms=>new Promise(r=>setTimeout(r,ms));
const report=(name,pass,detail)=>{results.push({name,pass,detail,at:new Date().toISOString()});out.textContent=JSON.stringify(results,null,2);if(!pass)throw Error(name);};
async function until(fn,timeout=45000){const end=performance.now()+timeout;while(!fn()){if(performance.now()>end)throw Error('超时');await pause(100);}}
function close(){h?.close();g?.close();running=false;}
document.querySelector('#stop').onclick=close;
document.querySelector('#run').onclick=async()=>{if(running)return;close();running=true;results=[];try{const policy={...DEFAULT_NET_POLICY,direction:'above',rttMs:100};let started=0,fault='';h=new PeerSession({role:'host',hero:13,policy,onstart:()=>started++,onfault:r=>fault=r});g=new PeerSession({role:'guest',hero:1,policy:null,onstart:()=>started++});await h.create();report('服务器创建十位房号',h.code.length===10,{code:h.code});await g.join(h.code);await until(()=>h.peerVersion&&g.peerVersion);report('真正双向WebRTC连接',h.connected&&g.connected,{host:h.info(),guest:g.info()});report('单次ping不能准备',!h.setReady(),h.info());await until(()=>h.gate().ok&&g.gate().ok);report('连续采样后双方合格',true,{host:h.info(),guest:g.info()});h.setReady();report('只有一方准备不能开战',!h.start());g.setReady();await until(()=>h.peerReady&&g.peerReady);report('双方准备后开战请求',h.start());await until(()=>started===2);report('双方提交相同比赛代号',h.seenEpoch===g.seenEpoch);let received=null;g.onmessage=m=>received=m;h.sendGame({type:'input',input:{attack:true}});await until(()=>received);report('DataChannel实际传输游戏输入',received.input.attack===true);h.returnToLobby();g.returnToLobby();
 const send=g.frames.send.bind(g.frames);g.frames.send=data=>{const m=JSON.parse(data);if(m.type==='pong')setTimeout(()=>g.frames.readyState==='open'&&send(data),180);else send(data);};await pause(12500);report('注入180ms回复延迟后禁止准备',!h.gate().ok&&!h.setReady(),h.info());g.frames.send=send;await until(()=>h.gate().ok&&g.gate().ok);report('恢复网络后可重新测量准备',true,h.info());
 const send2=g.frames.send.bind(g.frames);g.frames.send=data=>{if(JSON.parse(data).type!=='pong')send2(data);};await pause(12500);report('丢弃pong后丢包禁战',!h.gate().ok&&h.info().quality.loss>5,h.info());g.frames.send=send2;g.close();await until(()=>!h.connected,7000);report('断线清理并阻止继续',!h.fighting&&!h.ready,{reason:fault});out.textContent=JSON.stringify({result:'passed',results},null,2);
 }catch(e){out.textContent=JSON.stringify({result:'failed',error:String(e),results},null,2);}finally{close();}};
</script></html>
