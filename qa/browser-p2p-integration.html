<!doctype html><html lang="zh"><meta charset="utf-8"><title>P2P游戏与BGM集成验收</title>
<style>body{background:#0b1521;color:#ecf3f9;font:14px system-ui;margin:12px}button{padding:10px;margin:4px}iframe{width:49%;height:420px;border:1px solid #64788a}pre{white-space:pre-wrap;max-height:280px;overflow:auto;background:#182a3a;padding:12px}</style>
<h1>P2P游戏与BGM集成验收</h1><p>同机真实WebRTC，正常游戏UI及合成键盘事件；不代表跨网络、硬件输入或实际听音。100ms仅测试夹具。</p>
<button id="run">运行准备 / 战斗 / 重连</button><button id="below">运行低于100ms禁战</button><button id="music">打开房主音乐设置</button><button id="save">记录音乐状态</button><button id="reload-host">刷新房主页面</button>
<pre id="report">尚未执行</pre><iframe id="host" src="../index.html?qa=1"></iframe><iframe id="guest" src="../index.html?qa=1"></iframe><pre id="audio">音乐遥测</pre>
<script type="module">
const frames=[document.querySelector('#host'),document.querySelector('#guest')],out=document.querySelector('#report'),audio=document.querySelector('#audio');let results=[],busy=false,musicHistory=[],events=[];
const w=i=>frames[i].contentWindow,d=i=>w(i).DUEL,s=i=>d(i).snapshot,wait=ms=>new Promise(r=>setTimeout(r,ms));
function record(name,pass,detail){results.push({name,pass,detail,at:new Date().toISOString()});out.textContent=JSON.stringify({results},null,2);if(!pass)throw Error(name);}
async function until(fn,max=45000){const end=performance.now()+max;while(!fn()){if(performance.now()>end)throw Error('状态等待超时');await wait(50);}}
function click(i,selector){const e=w(i).document.querySelector(selector);if(!e||e.disabled)throw Error('按钮缺失或不可用 '+selector);e.click();}
function value(i,selector,v){w(i).document.querySelector(selector).value=v;}
function brief(i){const g=s(i);return g&&{phase:g.phase,round:g.round,time:g.time,score:g.score,fighters:g.fighters.map(f=>({hp:f.hp,cd:f.cd,x:f.x,y:f.y}))};}
async function pulse(i,code){for(const type of ['keydown','keyup'])w(i).dispatchEvent(new(w(i).KeyboardEvent)(type,{code,bubbles:true}));await wait(700);}
async function pair(direction='above'){
 for(let i=0;i<2;i++){click(i,'[data-mode="p2p"]');click(i,'[data-player="'+i+'"]');click(i,'[data-hero="13"]');click(i,'[data-action="start"]');}
 value(0,'#net-direction',direction);value(0,'#net-rtt','100');click(0,'[data-action="p2pCreate"]');await until(()=>d(0).network?.code);value(1,'#p2p-code',d(0).network.code);click(1,'[data-action="p2pJoin"]');await until(()=>d(0).room.connected&&d(1).room.connected);record('双方真实WebRTC版本握手',true,{host:d(0).network,guest:d(1).network});
}
async function start(){await until(()=>d(0).network.gate.ok&&d(1).network.gate.ok&&!w(0).document.querySelector('[data-action="p2pReady"]').disabled&&!w(1).document.querySelector('[data-action="p2pReady"]').disabled);record('未准备不能开战',w(0).document.querySelector('[data-action="p2pStart"]').disabled);click(0,'[data-action="p2pReady"]');await wait(150);record('只房主准备不能开战',w(0).document.querySelector('[data-action="p2pStart"]').disabled);click(1,'[data-action="p2pReady"]');await until(()=>d(0).network.peerReady);click(0,'[data-action="p2pStart"]');await until(()=>s(0)?.phase==='fight'&&s(1)?.phase==='fight');record('双方UI准备后进入同一回合',s(0).round===1&&s(1).round===1,{host:brief(0),guest:brief(1)});}
async function run(fn){if(busy)return;busy=true;results=[];try{await fn();out.textContent=JSON.stringify({result:'passed',results},null,2);}catch(e){out.textContent=JSON.stringify({result:'failed',error:String(e),results,host:d(0)?.network,guest:d(1)?.network},null,2);}finally{busy=false;}}
document.querySelector('#run').onclick=()=>run(async()=>{await pair();await start();const hp=s(0).fighters.map(f=>f.hp);await pulse(0,'KeyT');await pulse(1,'KeyT');click(0,'[data-action="pause"]');await wait(250);const a=brief(0),b=brief(1);record('双方技能经DataChannel同步伤害冷却计时',a.fighters.every((f,i)=>f.hp<hp[i])&&JSON.stringify(a)===JSON.stringify(b),{host:a,guest:b});await wait(500);record('客端收到同步暂停且计时冻结',!!w(1).document.querySelector('.pausepanel')&&s(0).time===a.time);
 const old=d(0).network.code;frames[1].src='../index.html?qa=1&reconnect='+Date.now();await until(()=>!d(0).room.connected);record('实际刷新客端触发断线暂停',d(0).engine.paused&&!d(0).network.fighting&&!d(0).network.ready,{host:d(0).network});await until(()=>d(1)?.state.screen==='select');click(0,'[data-action="p2pRetry"]');click(0,'[data-action="close"]');await pair();record('重连创建新房号',old!==d(0).network.code);await start();record('重连不恢复旧回合血量',s(0).fighters.every(f=>f.hp===f.maxHp)&&s(0).score.every(x=>x===0));click(0,'[data-action="pause"]');});
document.querySelector('#below').onclick=()=>run(async()=>{await pair('below');await until(()=>d(0).network.quality.samples>=24&&d(1).network.quality.samples>=24);record('低于100ms规则按参数拒绝准备',d(0).network.quality.p95<100&&!d(0).network.gate.ok&&w(0).document.querySelector('[data-action="p2pReady"]').disabled,{host:d(0).network,guest:d(1).network});});
document.querySelector('#music').onclick=()=>click(0,'[data-action="music"]');
document.querySelector('#save').onclick=()=>{musicHistory.push({at:new Date().toISOString(),status:d(0).musicStatus});};
document.querySelector('#reload-host').onclick=()=>{frames[0].src='../index.html?qa=1&reload='+Date.now();};
for(let i=0;i<2;i++)frames[i].addEventListener('load',()=>{for(const name of ['pagehide','pageshow','visibilitychange']){const target=name==='visibilitychange'?w(i).document:w(i);target.addEventListener(name,e=>events.push({i,event:name,trusted:e.isTrusted,hidden:w(i).document.hidden,status:d(i).musicStatus,at:new Date().toISOString()}));}});
let previous=null;setInterval(()=>{if(d(0)){const current=d(0).musicStatus;if(current.playing&&previous?.playing&&current.name===previous.name&&current.time<previous.time-.3){musicHistory.push({event:'actual playback time wrapped',before:previous.time,after:current.time,at:new Date().toISOString()});if(musicHistory.length>60)musicHistory.shift();}previous=current;audio.textContent=JSON.stringify({current,history:musicHistory,events},null,2);}},150);
</script></html>
