ading strong{display:block;font-size:22px;letter-spacing:3px;color:#eac788}#startup-progress{display:block;width:100%;height:5px;margin:20px 0 12px;accent-color:#eac788}#startup-loading [hidden]{display:none!important}#startup-status{margin:12px 0}#startup-retry{min-height:44px;padding:8px 24px;border:1px solid #eac788;border-radius:4px;background:#192127;color:#eaf0ee;font:inherit}</style></head><body><section id="startup-loading" aria-label="DOTA PK" aria-busy="true"><div class="startup-content"><strong>DOTA PK</strong><progress id="startup-progress" max="2" aria-label="启动进度 / Startup progress"></progress><p id="startup-status" role="status" aria-live="polite">正在加载 / Loading…</p><button id="startup-retry" type="button" hidden>重试 / Retry</button><noscript>请启用 JavaScript 后重新打开。 / Enable JavaScript and reopen.</noscript></div></section>
<script id="startup-bootstrap">
(function(){
 var root=document.getElementById('startup-loading'),bar=document.getElementById('startup-progress'),text=document.getElementById('startup-status'),retry=document.getElementById('startup-retry');
 var lang='zh',key='dota-duel-language',saved,styles=false,app=false,finished=false,reloading=false,phase='loading',timer;
 try{saved=(document.cookie||'').split(';').map(function(s){return s.trim();}).filter(function(s){return s.indexOf(key+'=')===0;})[0];saved=saved&&saved.slice(key.length+1);}catch(e){}
 if(saved!=='zh'&&saved!=='en'){try{saved=window.localStorage.getItem(key);}catch(e){}}
 if(saved==='en')lang='en';
 var copy=lang==='en'?{loading:'Loading the app…',styles:'Preparing the page…',init:'Starting the app…',ready:'Ready',slow:'Loading is taking longer. You can retry.',failed:'Unable to finish loading. Please retry.',retry:'Retry',tasks:'startup tasks complete'}:{loading:'正在加载应用…',styles:'正在准备页面…',init:'正在启动应用…',ready:'已就绪',slow:'加载尚未完成，可以重试。',failed:'加载未完成，请重试。',retry:'重试',tasks:'项启动任务已完成'};
 retry.textContent=copy.retry;
 function update(){
  if(finished)return;
  var count=Number(styles)+Number(app);
  if(phase!=='failed'){if(count)bar.value=count;else bar.removeAttribute('value');text.textContent=(app?copy.styles:copy.loading)+' '+count+'/2 '+copy.tasks;}
  if(styles&&app){
   phase='ready';finished=true;clearTimeout(timer);root.setAttribute('aria-busy','false');bar.hidden=false;bar.value=2;retry.hidden=true;text.textContent=copy.ready;
   window.removeEventListener('error',onError);window.removeEventListener('unhandledrejection',onRejection);
   requestAnimationFrame(function(){requestAnimationFrame(function(){root.remove();});});
  }
 }
 function fail(reason){if(finished)return;phase='failed';clearTimeout(timer);root.setAttribute('aria-busy','false');bar.hidden=true;text.textContent=reason==='timeout'?copy.slow:copy.failed;retry.hidden=false;}
 function onError(e){if(e.target===window&&!app)fail('initialization');}
 function onRejection(){if(!app)fail('initialization');}
 retry.onclick=function(){if(finished||reloading)return;var duel=window.DUEL;if(duel&&(duel.state.screen==='battle'||duel.state.room))return;reloading=true;retry.disabled=true;window.location.reload();};
 window.DOTA_STARTUP={stylesReady:function(){styles=true;update();},moduleLoaded:function(){if(!app&&phase!=='failed')text.textContent=copy.init;},appReady:function(){app=true;var style=document.getElementById('startup-style');if(style&&style.tagName==='STYLE')styles=true;update();},fail:fail,info:function(){return {phase:phase,completed:Number(styles)+Number(app),total:2,language:lang};}};
 window.addEventListener('error',onError);window.addEventListener('unhandledrejection',onRejection);
 timer=setTimeout(function(){fail('timeout');},45000);update();
})();
</script>
